services:
  granite-embedding:
    image: ghcr.io/ggerganov/llama.cpp:server-cuda
    command: -m /models/emb/granite-embedding-97M-multilingual-r2-Q8_0.gguf --host 0.0.0.0 --port 8080 -c 8192 --alias granite-embedding --embedding --pooling mean --n-gpu-layers 99
    volumes:
      - ./models/emb:/models/emb:ro
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "11434:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/models"]
      interval: 10s
      timeout: 3s
      retries: 10

  llm:
    image: ghcr.io/ggerganov/llama.cpp:server-cuda
    command: -m /models/llm/Qwen3.5-2B-Q4_K_M.gguf --host 0.0.0.0 --port 8080 -c 16384 --alias qwen3.5-2b --n-gpu-layers 99 --jinja
    volumes:
      - ./models/llm:/models/llm:ro
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "11435:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/models"]
      interval: 10s
      timeout: 3s
      retries: 20
    depends_on:
      granite-embedding:
        condition: service_healthy

  searxng:
    image: searxng/searxng:latest
    ports:
      - "8888:8080"
    volumes:
      - ./searxng:/etc/searxng:ro
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10

  voice-chat:
    build: .
    depends_on:
      llm:
        condition: service_healthy
      granite-embedding:
        condition: service_healthy
      searxng:
        condition: service_healthy
    environment:
      - LLM_API_BASE=http://llm:8080/v1
      - EMBED_API_BASE=http://granite-embedding:8080/v1
      - SEARXNG_URL=http://searxng:8080
      # Set VOICE_CHAT_TOKEN in the environment (or a .env file) before publishing this
      # port anywhere. Without it every route except model-switching is open to anyone
      # who can reach it; with it, clients pass ?token=… or X-Auth-Token.
      - VOICE_CHAT_TOKEN=${VOICE_CHAT_TOKEN:-}
      # Compose serves the SPA from the same origin, so same-site dev origins only.
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - ./models/tts:/models/tts:ro
      - ./models/stt:/models/stt:ro
      - ./searxng:/etc/searxng:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 10
